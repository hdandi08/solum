version: 0.2

env:
  parameter-store:
    SUPABASE_URL:              /solum/test/supabase-url
    SUPABASE_SERVICE_ROLE_KEY: /solum/test/supabase-svc-key
    DEV_BASE_URL:              /solum/test/dev-base-url

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd $CODEBUILD_SRC_DIR/web
      - npm ci
      - npx playwright install --with-deps chromium

  build:
    commands:
      # Fast unit tests first (fail-fast before the slower e2e run).
      - cd $CODEBUILD_SRC_DIR/web
      - npm run test:unit
      # Pure-logic server tests (node:test, no extra deps).
      - cd $CODEBUILD_SRC_DIR
      - node --test supabase/functions/_shared/*.test.mjs
      # End-to-end tests.
      - cd $CODEBUILD_SRC_DIR/web
      - npx playwright test --reporter=list,html

  post_build:
    commands:
      - cd $CODEBUILD_SRC_DIR
      - |
        REPORT_DATE=$(date +%Y-%m-%d)
        REPORT_KEY="reports/$REPORT_DATE/index.html"
        aws s3 sync web/playwright-report \
          s3://$REPORT_BUCKET/reports/$REPORT_DATE/ --delete --quiet
        REPORT_URL="https://$REPORT_BUCKET.s3.eu-west-2.amazonaws.com/$REPORT_KEY"
        echo "Report: $REPORT_URL"
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "0" ]; then
          MSG=$(printf 'SOLUM tests FAILED on dev (%s) — unit and/or e2e.\n\nOpen the e2e report:\n%s\n\nBuild ID: %s' \
            "$REPORT_DATE" "$REPORT_URL" "$CODEBUILD_BUILD_ID")
          aws sns publish \
            --topic-arn $SNS_TOPIC_ARN \
            --subject "SOLUM Tests FAILED — $REPORT_DATE" \
            --message "$MSG"
        else
          MSG=$(printf 'SOLUM tests passed on dev (%s) — unit + e2e.\n\nFull e2e report:\n%s\n\nBuild ID: %s' \
            "$REPORT_DATE" "$REPORT_URL" "$CODEBUILD_BUILD_ID")
          aws sns publish \
            --topic-arn $SNS_TOPIC_ARN \
            --subject "SOLUM Tests passed — $REPORT_DATE" \
            --message "$MSG"
        fi

artifacts:
  files:
    - web/playwright-report/**/*
  discard-paths: no
