<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOLUM — Posting Board</title>
<style>
:root{--black:#08090B;--char:#181C24;--blue:#2E6DA4;--sky:#4A8FC7;--bone:#F0ECE2;--line:#1e2530;}
*{box-sizing:border-box}
body{margin:0;background:var(--black);color:var(--bone);font:15px/1.5 'Barlow Condensed','Helvetica Neue',Arial,sans-serif;}
header{padding:22px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--black);z-index:5}
h1{margin:0;font-size:22px;letter-spacing:.18em;font-weight:700}
.sub{color:#8a8f99;font-size:13px;margin-top:4px;letter-spacing:.04em}
.wrap{padding:24px 28px;max-width:1500px;margin:0 auto}
h2{font-size:13px;letter-spacing:.2em;color:#8a8f99;text-transform:uppercase;margin:30px 0 14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--char);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card.posted{opacity:.55}
.media{background:#000;aspect-ratio:9/16;max-height:360px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.media video,.media img{width:100%;height:100%;object-fit:contain;background:#000}
.carou{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
.carou img{flex:0 0 100%;scroll-snap-align:center}
.body{padding:12px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:5px;font-weight:600}
.cold{background:#16344f;color:#9ccbf0}.warm{background:#5a4a1e;color:#e8cf86}.hot{background:#5a1e22;color:#f0a0a0}
.day{font-size:11px;letter-spacing:.1em;color:#8a8f99;text-transform:uppercase}
.title{font-size:16px;font-weight:600;line-height:1.25}
.type{font-size:12px;color:#8a8f99;letter-spacing:.06em}
.cap{background:#10131a;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px;color:#cfd3da;white-space:pre-wrap;max-height:120px;overflow:auto}
.btns{display:flex;gap:7px;flex-wrap:wrap}
button,a.btn{font:inherit;font-size:12px;letter-spacing:.06em;border:1px solid var(--line);background:#10131a;color:var(--bone);
  padding:7px 10px;border-radius:7px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.15s}
button:hover,a.btn:hover{border-color:var(--blue);color:#fff}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dl{color:var(--sky)}
.foot{margin-top:auto;display:flex;gap:7px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:9px}
.tag{font-size:11px;color:#6b7080}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;letter-spacing:.06em}
.toast.show{opacity:1}
</style></head><body>
<header><h1>SOLUM · POSTING BOARD</h1><div class="sub">Batch 01 (feed) + BTS Stories · IG + TikTok · progress saved in this browser</div></header>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const DATA = {"posts": [{"id": "b01-cold-back", "day": 2, "stage": "cold", "type": "Still", "title": "Your back has never been clean", "media": ["batch-01/b01-cold-back_4x5.jpg", "batch-01/b01-cold-back_9x16.jpg"], "captions": "batch-01/b01-cold-back.captions.txt", "caps": {"instagram": "You shower every day. Your back has never once been properly cleaned. Your arms can't reach it. Product 03 is the only tool that does. \u2192 link in bio\n#mensgrooming #skincareformen #bodycare #backcare #menswellness", "tiktok": "Your back has never been clean. Here's why. \u2192 bysolum.co.uk\n#mensgrooming #skincareformen #bodycare #hygienetok #menswellness"}}, {"id": "b01-cold-mitt", "day": 1, "stage": "cold", "type": "Reel", "title": "Face-first: why your skin never feels clean", "media": ["batch-01/b01-cold-mitt-facefirst_9x16.mp4"], "captions": "batch-01/b01-cold-mitt.captions.txt", "caps": {"instagram": "A flannel doesn't exfoliate. It just moves water around. The Korean bathhouse mitt lifts the dead skin your shower leaves behind. Long circular strokes, front of body, daily. Cleans. Doesn't strip. \u2192 link in bio\n#mensgrooming #skincareformen #bodycare #showerroutine #menswellness", "tiktok": "POV: you've been washing your body wrong your whole life. The mitt does what a flannel can't. \u2192 bysolum.co.uk\n#mensgrooming #skincareformen #bodycare #showertok #menswellness"}}, {"id": "b01-warm-3min", "day": 3, "stage": "warm", "type": "Carousel (5)", "title": "The 3-minute window", "media": ["batch-01/b01-warm-3min_s1_4x5.jpg", "batch-01/b01-warm-3min_s2_4x5.jpg", "batch-01/b01-warm-3min_s3_4x5.jpg", "batch-01/b01-warm-3min_s4_4x5.jpg", "batch-01/b01-warm-3min_s5_4x5.jpg"], "captions": "batch-01/b01-warm-3min.captions.txt", "caps": {"instagram": "Skin absorbs 70% more moisture in the first 3 minutes after towelling, while it's still warm. Miss the window and it evaporates. Two pumps. Press in, don't rub. Save this. \u2192 link in bio\n#mensskincare #bodycare #skincareformen #groomingtips #menswellness", "tiktok": "You have 3 minutes after your shower. Most men waste them. \u2192 bysolum.co.uk\n#mensskincare #bodycare #skincareformen #skincaretok #grwm"}}, {"id": "b01-cold-banner9", "day": 4, "stage": "cold", "type": "Reel", "title": "Banner hook \u2014 the system you were never taught", "media": ["batch-01/b01-cold-banner9_9x16.mp4"], "captions": "batch-01/b01-cold-banner9.captions.txt", "caps": {"instagram": "Most men shower every day and still get it wrong, because nobody ever built them a system. Head to toe. This is it. \u2192 link in bio\n#mensgrooming #skincareformen #bodycare #groomingtips #menswellness", "tiktok": "The body care system you were never taught. \u2192 bysolum.co.uk\n#mensgrooming #skincareformen #bodycare #grwm #menswellness"}}, {"id": "b01-warm-clay", "day": 5, "stage": "warm", "type": "Reel", "title": "Atlas clay \u2014 1,000 years", "media": ["batch-01/b01-warm-clay_9x16.mp4"], "captions": "batch-01/b01-warm-clay.captions.txt", "caps": {"instagram": "Moroccan rhassoul clay has drawn impurities out of skin for 1,000 years. Mined in the Atlas Mountains, mineral rich. Once a week, head to toe, 8 to 10 minutes. \u2192 link in bio\n#rhassoulclay #mensgrooming #naturalskincare #bodycare #skincareformen", "tiktok": "1,000-year-old Moroccan clay vs your skin. Weekly ritual. \u2192 bysolum.co.uk\n#rhassoulclay #mensgrooming #naturalskincare #skincaretok #bodycare"}}, {"id": "b01-hot-kit", "day": 6, "stage": "hot", "type": "Slideshow", "title": "Kit reveal \u2014 GROUND \u00a365 / RITUAL \u00a385", "media": ["batch-01/b01-hot-kit_9x16.mp4"], "captions": "batch-01/b01-hot-kit.captions.txt", "caps": {"instagram": "Not a 12 step routine. One system, ten minutes, head to toe. GROUND \u00a365 is the foundation. RITUAL \u00a385 adds the weekly oil. First batch is limited. Your body. Done right. \u2192 link in bio\n#mensgrooming #skincareformen #bodycare #groomingroutine #menswellness", "tiktok": "One kit. Everything you've been missing. GROUND \u00a365 / RITUAL \u00a385. \u2192 bysolum.co.uk\n#mensgrooming #skincareformen #bodycare #grwm #menswellness"}}, {"id": "b03-back-misses", "day": 1, "stage": "cold", "type": "Reel (montage)", "title": "Montage: the part your shower misses", "media": ["batch-03-montage/b03-back-misses_9x16.mp4"], "captions": "batch-03-montage/b03-back-misses.captions.txt", "caps": {"instagram": "Your arms can't reach the middle of your back. So it never actually gets clean, no matter how long you stand in the shower. The back cloth is the only tool that reaches it. One minute, daily. Save this. \u2192 link in bio\n#mensgrooming #skincareformen #bodycare #backcare #menswellness", "tiktok": "The one part of your body that never gets clean. \u2192 bysolum.co.uk\n#mensgrooming #skincareformen #bodycare #hygienetok #menswellness"}}], "stories": [{"id": "b02-shootday", "title": "SHOOT DAY", "media": ["batch-02-bts/b02-bts-shootday_9x16.jpg"]}, {"id": "b02-behind", "title": "BEHIND THE SCENES", "media": ["batch-02-bts/b02-bts-behind_9x16.jpg"]}, {"id": "b02-face", "title": "The face of SOLUM", "media": ["batch-02-bts/b02-bts-face_9x16.jpg"]}, {"id": "b02-warehouse", "title": "THE FIRST BATCH HAS LANDED", "media": ["batch-02-bts/b02-bts-warehouse_9x16.mp4"]}, {"id": "b02-comingsoon", "title": "COMING SOON", "media": ["batch-02-bts/b02-bts-comingsoon_9x16.jpg"]}], "days": ["", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]};
const LS = 'solum_board_posted_v1';
const posted = JSON.parse(localStorage.getItem(LS) || '{}');
function save(){localStorage.setItem(LS, JSON.stringify(posted));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200);}
function fallbackCopy(txt){
  const ta=document.createElement('textarea');ta.value=txt;
  ta.style.position='fixed';ta.style.top='-9999px';document.body.appendChild(ta);
  ta.focus();ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){ok=false;}
  document.body.removeChild(ta);toast(ok?'Caption copied':'Copy failed, select manually');
}
function copy(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('Caption copied')).catch(()=>fallbackCopy(txt));
  }else{fallbackCopy(txt);}
}
function isPosted(id){return posted[id]&&posted[id].ig&&posted[id].tt;}
function mediaEl(m){
  if(m.endsWith('.mp4')) return `<video src="./${m}" controls preload="metadata" playsinline></video>`;
  return `<img src="./${m}" loading="lazy">`;
}
function mediaBlock(media){
  if(media.length>1 && media[0].endsWith('.jpg')) return `<div class="media carou">${media.map(m=>`<img src="./${m}" loading="lazy">`).join('')}</div>`;
  return `<div class="media">${mediaEl(media[0])}</div>`;
}
function dlBtns(media){return media.map((m,i)=>`<a class="btn dl" href="./${m}" download>⤓ ${media.length>1?('file '+(i+1)):'download'}</a>`).join('');}
function postBtns(id){
  const st = posted[id]||{};
  return `<button class="pb ${st.ig?'on':''}" data-id="${id}" data-p="ig">IG ${st.ig?'✓':''}</button>
          <button class="pb ${st.tt?'on':''}" data-id="${id}" data-p="tt">TikTok ${st.tt?'✓':''}</button>`;
}
function card(p){
  const c = p.caps||{};
  const cap = (c.instagram||c.tiktok) ? `
    <div class="row"><span class="tag">Instagram</span></div><div class="cap">${(c.instagram||'').replace(/</g,'&lt;')}</div>
    <div class="btns"><button class="copy-btn" data-id="${p.id}" data-cap="instagram">📋 Copy IG</button>
    <button class="copy-btn" data-id="${p.id}" data-cap="tiktok">📋 Copy TikTok</button></div>` : '';
  return `<div class="card ${isPosted(p.id)?'posted':''}" id="c-${p.id}">
    ${mediaBlock(p.media)}
    <div class="body">
      <div class="row"><span class="badge ${p.stage}">${p.stage}</span><span class="day">${DATA.days[p.day]||''}</span><span class="type">${p.type}</span></div>
      <div class="title">${p.title}</div>
      ${cap}
      <div class="foot">${postBtns(p.id)} ${dlBtns(p.media)}</div>
    </div></div>`;
}
function storyCard(s){
  return `<div class="card ${isPosted(s.id)?'posted':''}" id="c-${s.id}">
    ${mediaBlock(s.media)}
    <div class="body"><div class="title">${s.title}</div>
    <div class="type">Story · 9:16</div>
    <div class="foot">${postBtns(s.id)} ${dlBtns(s.media)}</div></div></div>`;
}
const app=document.getElementById('app');
let html='<h2>Batch 01 — 7-day feed schedule</h2><div class="grid">';
[...DATA.posts].sort((a,b)=>a.day-b.day).forEach(p=>html+=card(p));
html+='</div><h2>BTS Stories — post as a sequence (any day)</h2><div class="grid">';
DATA.stories.forEach(s=>html+=storyCard(s));
html+='</div>';
app.innerHTML=html;
const postById={};DATA.posts.forEach(p=>postById[p.id]=p);
document.querySelectorAll('.copy-btn').forEach(b=>b.addEventListener('click',()=>{
  const p=postById[b.dataset.id];if(!p||!p.caps)return;
  copy(p.caps[b.dataset.cap]||'');
}));
document.querySelectorAll('.pb').forEach(b=>b.addEventListener('click',()=>{
  const id=b.dataset.id,pl=b.dataset.p;posted[id]=posted[id]||{};posted[id][pl]=!posted[id][pl];save();
  b.classList.toggle('on',posted[id][pl]);b.textContent=(pl==='ig'?'IG ':'TikTok ')+(posted[id][pl]?'✓':'');
  document.getElementById('c-'+id).classList.toggle('posted',isPosted(id));
}));
</script></body></html>
